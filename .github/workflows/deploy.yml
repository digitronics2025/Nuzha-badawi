name: NUSYA Deploy
# Single deployment pipeline: tests → staging → staging e2e → production → production smoke.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN      — scoped token: Account Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit,
#                               Zone (nozha-badavi.com) Workers Routes:Edit. Never commit it.
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — staging-only Access service token for e2e checks.
# The `production` GitHub environment can require a manual approval before the production job.
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'workers/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Verify Access credentials only, or run the deployment pipeline
        type: choice
        options: [verify, deploy]
        default: verify
permissions:
  contents: read
concurrency:
  group: nusya-deploy
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: 5e8dba9ffe785310eadc601c447a4ad6
jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: workers/package-lock.json }
      - run: npm ci
        working-directory: workers
      - run: npm run build:frontend && npm run check
        working-directory: workers
      - run: python3 -m unittest discover -s frontend/tests -v
      - name: Native runtime and browser regressions
        run: |
          cd workers
          npx wrangler deploy --dry-run --config public/wrangler.jsonc --outdir /tmp/nusya-runtime-bundle
          node tools/review-runtime.mjs /tmp/nusya-runtime-bundle/index.js
          cd ..
          pip install -r frontend/tests/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
          python3 frontend/tests/browser_review.py
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository Actions secret $name is unavailable. Deployment cannot proceed."
              missing=1
            fi
          done
          exit "$missing"
  verify-access:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify rotated staging credentials without changing data
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const config=readFileSync('workers/admin/wrangler.staging.jsonc','utf8');
          const allowed=config.match(/"SERVICE_TOKEN_OWNERS"\s*:\s*"([^"]+)"/)?.[1].split(',').map(x=>x.trim())||[];
          if(!allowed.includes(process.env.CF_ACCESS_CLIENT_ID)){
            console.error('GitHub CF_ACCESS_CLIENT_ID does not match the staging Worker allowlist. Update it to the Client ID of the rotated staging token.');
            process.exit(1);
          }
          console.log('PASS: GitHub Client ID matches the staging Worker allowlist.');
          const headers={
            'CF-Access-Client-Id':process.env.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':process.env.CF_ACCESS_CLIENT_SECRET
          };
          try {
            const staging=await fetch('https://nusya-admin-staging.digitronics-electro.workers.dev/api/v1/admin/me',{headers,redirect:'manual',signal:AbortSignal.timeout(15000)});
            if(staging.status!==200)throw Error('Staging authentication returned HTTP '+staging.status);
            const session=await staging.json();
            if(session.ok!==true||session.role!=='owner'||session.userId!==process.env.CF_ACCESS_CLIENT_ID)throw Error('Staging identity did not match the configured service token');
            console.log('PASS: rotated credentials authenticate to staging as the expected service identity.');
            const production=await fetch('https://admin.nozha-badavi.com/api/v1/admin/me',{headers,redirect:'manual',signal:AbortSignal.timeout(15000)});
            if(![302,401,403].includes(production.status))throw Error('Production isolation check returned unexpected HTTP '+production.status);
            console.log('PASS: staging credentials do not grant production admin access.');
          } catch(error) {
            console.error(error.message);
            process.exitCode=1;
          }
          JS
  staging:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    needs: [test, gate]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: workers/package-lock.json }
      - run: npm ci && npm run build:frontend
        working-directory: workers
      - name: Migrate + deploy staging
        working-directory: workers
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          npx wrangler d1 migrations apply nusya-platform-staging --remote --config public/wrangler.staging.jsonc
          npx wrangler deploy --config admin/wrangler.staging.jsonc
          npx wrangler deploy --config public/wrangler.staging.jsonc
      - name: Staging end-to-end
        working-directory: workers
        env:
          PUBLIC_URL: https://nusya-public-staging.digitronics-electro.workers.dev
          ADMIN_URL: https://nusya-admin-staging.digitronics-electro.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          MODE: staging
        run: node tools/e2e-smoke.mjs
  production:
    if: github.ref == 'refs/heads/main'
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: workers/package-lock.json }
      - run: npm ci && npm run build:frontend
        working-directory: workers
      - name: Record D1 Time Travel restore point before migrating
        # Full-data, point-in-time recovery (30 days) without copying customer PII out of Cloudflare.
        # Restore: npx wrangler d1 time-travel restore nusya-platform --bookmark=<logged bookmark>
        working-directory: workers
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          npx wrangler d1 time-travel info nusya-platform --json | tee time-travel.json
          echo "### D1 restore point before deploy" >> "$GITHUB_STEP_SUMMARY"
          node -e "console.log('Bookmark: \`'+JSON.parse(require('fs').readFileSync('time-travel.json','utf8')).bookmark+'\`')" >> "$GITHUB_STEP_SUMMARY"
      - name: Migrate + deploy production
        working-directory: workers
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          npx wrangler d1 migrations apply nusya-platform --remote --config public/wrangler.jsonc
          npx wrangler deploy --config admin/wrangler.jsonc
          npx wrangler deploy --config public/wrangler.jsonc
      - name: Production smoke (read-only)
        working-directory: workers
        env: { PUBLIC_URL: 'https://nozha-badavi.com', ADMIN_URL: 'https://admin.nozha-badavi.com', MODE: production }
        run: node tools/e2e-smoke.mjs
