name: NUSYA Frontend Checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
permissions:
  contents: read
jobs:
  static-build-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static frontend
        run: python scripts/build.py
      - name: Unit and HTML contract checks
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: |
          node --check src/assets/site.js
          node --check src/assets/admin.js
      - name: Check outputs exist
        run: |
          test -f dist-public/en/index.html
          test -f dist-public/ar/index.html
          test -f dist-public/ru/index.html
          test -f dist-admin/index.html
          test -f dist-public/sitemap.xml
